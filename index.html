<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="expenses.css">
  
  <title>Frontend Mentor | Expenses chart component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <main>

    <header>
      <div>
      <p>My balance</p>

      <h2>$921.48</h2>
      </div>

      <div>
        <img src="./images/logo.svg" alt="">
      </div>
    </header>

    <section>

      <h2 class="Spending">Spending - Last 7 days</h2>

      <div class="barChart" id="barChart">

        <div class="days">

        <p class="mon">mon</p>

        <p class="tue">tue</p>

        <p class="wed">wed</p>

        <p class="thu">thu</p>

        <p class="fri">fri</p>

        <p class="sat">sat</p>

        <p class="sun">sun</p>

        </div>
      
      </div>
      
  <hr>

  <div class="Total"> 

  <div>
    <p class="this">Total this month</p>

    <h1>$478.33</h1>
  </div>

  <div class="from">
    <h4>+2.4%</h4>

    <p class="last">from last month</p>
  </div>

  </div>



    </section>

  </main>
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Osolase</a>.
  </div>

  <script src="expenses.js"></script>


</body>

</html>
